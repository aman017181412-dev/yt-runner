name: Video Pipeline

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Channel config key, for example channel1'
        required: true
        type: string
  # Deliberately no pull_request or pull_request_target trigger.

permissions:
  contents: read

jobs:
  # --- prepare -----------------------------------------------------------
  # Research -> planning -> script -> SEO -> audience profile, then fires
  # the voice generation job WITHOUT waiting for it (run_pipeline.py
  # --stage=prepare). Deliberately NOT in the shared "video-pipeline"
  # concurrency group -- see publish-commit.yml's header comment for why
  # only the git-push-sensitive step actually needs it.
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      # Per-CHANNEL only, so this channel can't double-run against
      # itself if triggered twice in quick succession -- different
      # channels are free to prepare/voice/publish concurrently now.
      group: video-pipeline-prepare-${{ inputs.channel }}
      cancel-in-progress: false
    outputs:
      folder_path: ${{ steps.folder.outputs.path }}
      prepared_artifact: pipeline-prepared-${{ inputs.channel }}-${{ github.run_id }}
    steps:
      - name: Checkout private core repo
        uses: actions/checkout@v4
        with:
          repository: aman017181412-dev/yt-core
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: core
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: core/requirements.txt

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core tesseract-ocr

      - name: Install Python dependencies
        working-directory: core
        run: pip install -r requirements.txt

      - name: Install Playwright browser (for optional tutorial screen recording)
        working-directory: core
        run: python -m playwright install --with-deps chromium

      - name: Resolve pipeline folder path
        id: folder
        working-directory: core
        env:
          CHANNEL: ${{ inputs.channel }}
        run: echo "path=$(python -m scripts.print_pipeline_folder --channel "$CHANNEL")" >> "$GITHUB_OUTPUT"

      - name: Run pipeline (prepare stage)
        working-directory: core
        env:
          CHANNEL: ${{ inputs.channel }}
          # Single-key setup (unchanged): GROQ_API_KEY / OPENROUTER_API_KEY.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Multi-account key pool (llm.py): one secret per provider holding
          # comma-separated keys from SEPARATE accounts, e.g.
          # "key_from_acct1,key_from_acct2,...". Wins over the singular
          # secret above if both are set. See llm.py's module docstring for
          # why keys from the SAME account don't help (shared rate limit)
          # and the ToS note on multiple accounts.
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
          # Used both as an LLM fallback (llm.py) and for thumbnail-related
          # Gemini calls later. Optional -- both features no-op cleanly
          # without it.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # F5TTS voice-cloning Factory Pool (see voice_clone_client.py's
          # module docstring). VOICE_FACTORIES_JSON is a JSON array of one
          # or more independent yt-voice deployments to pool -- omit it
          # and set the two below instead for a single-factory setup.
          VOICE_FACTORIES_JSON: ${{ secrets.VOICE_FACTORIES_JSON }}
          VOICE_SERVICE_REPO: ${{ vars.VOICE_SERVICE_REPO }}
          VOICE_SERVICE_DISPATCH_PAT: ${{ secrets.VOICE_SERVICE_DISPATCH_PAT }}
          YOUTUBE_RESEARCH_API_KEY: ${{ secrets.YOUTUBE_RESEARCH_API_KEY }}
        run: python -m scripts.run_pipeline --stage=prepare --channel "$CHANNEL"

      - name: Upload prepared pipeline data
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-prepared-${{ inputs.channel }}-${{ github.run_id }}
          path: core/${{ steps.folder.outputs.path }}
          retention-days: 1

  # --- voice ---------------------------------------------------------------
  # Separate workflow file (voice-generate.yml), no shared concurrency lock
  # -- this is the step that can sit for a long time polling the F5TTS
  # Factory Pool, and it must not block other channels while it waits. See
  # that file's own comment.
  voice:
    needs: prepare
    uses: ./.github/workflows/voice-generate.yml
    with:
      channel: ${{ inputs.channel }}
      prepared_artifact: ${{ needs.prepare.outputs.prepared_artifact }}
      folder_path: ${{ needs.prepare.outputs.folder_path }}
    secrets: inherit

  # --- publish-render --------------------------------------------------------
  # Footage -> thumbnail -> edit -> upload, resuming from the already-
  # generated voice audio (run_pipeline.py --stage=publish), then a LOCAL
  # git commit exported as a patch. Separate workflow file
  # (publish-render.yml), per-CHANNEL concurrency group only -- see that
  # file's header comment. This replaces the old monolithic "publish" job
  # that held the shared "video-pipeline" lock for its entire (often very
  # long) duration; now only publish-commit below does, and only briefly.
  publish-render:
    needs: [prepare, voice]
    uses: ./.github/workflows/publish-render.yml
    with:
      channel: ${{ inputs.channel }}
      voiced_artifact: ${{ needs.voice.outputs.voiced_artifact }}
      # Read from voice's output, NOT needs.prepare.outputs.folder_path --
      # see voice-generate.yml's own comment on the same null-outputs
      # quirk (mixing a plain job and a reusable-workflow-call job in one
      # `needs:` list can resolve the plain job's outputs to null here).
      folder_path: ${{ needs.voice.outputs.folder_path }}
    secrets: inherit

  # --- publish-commit ----------------------------------------------------
  # Applies + pushes the patch publish-render produced, AND (Sep 2026 fix)
  # separately folds in this run's script-hash registry entry, if any.
  # Separate workflow file (publish-commit.yml), THE ONLY job left in the
  # shared "video-pipeline" concurrency group -- see that file's header
  # comment for both parts.
  publish-commit:
    needs: publish-render
    uses: ./.github/workflows/publish-commit.yml
    with:
      channel: ${{ inputs.channel }}
      patch_artifact: ${{ needs.publish-render.outputs.patch_artifact }}
      changed: ${{ needs.publish-render.outputs.changed }}
      # Sep 2026 fix -- see publish-commit.yml's header comment: the
      # script-hash registry entry now travels as its own artifact,
      # separate from the data/ patch above, and gets folded in by its
      # own fresh-fetch step instead of git-am.
      hashes_artifact: ${{ needs.publish-render.outputs.hashes_artifact }}
      hashes_changed: ${{ needs.publish-render.outputs.hashes_changed }}
    secrets: inherit
