name: Voice Generate (reusable)

# Called from video-pipeline.yml's "voice" job, NOT triggered directly.
# Deliberately its own workflow file (not just another job in
# video-pipeline.yml) with NO shared concurrency group -- this is the
# step that can sit for a long time polling the F5TTS Factory Pool (see
# voice_clone_client.py), and it must NOT hold video-pipeline.yml's
# shared "video-pipeline" lock while it waits, or every other queued
# channel sits idle behind it for no reason. Only the SAME channel can't
# overlap with itself (see the per-channel concurrency group below);
# different channels' voice jobs now run freely in parallel.
on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
      prepared_artifact:
        required: true
        type: string
      folder_path:
        required: true
        type: string
    outputs:
      voiced_artifact:
        value: ${{ jobs.generate.outputs.voiced_artifact }}

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: voice-generate-${{ inputs.channel }}
      cancel-in-progress: false
    outputs:
      voiced_artifact: pipeline-voiced-${{ inputs.channel }}-${{ github.run_id }}
    steps:
      - name: Checkout private core repo
        uses: actions/checkout@v4
        with:
          repository: aman017181412-dev/yt-core
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: core
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: core/requirements.txt

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        working-directory: core
        run: pip install -r requirements.txt

      - name: Download prepared pipeline data
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.prepared_artifact }}
          path: core/${{ inputs.folder_path }}

      - name: Wait for voice generation (Factory Pool poll + merge, or edge-tts fallback)
        working-directory: core
        env:
          CHANNEL: ${{ inputs.channel }}
          # Multi-account Factory Pool -- see voice_clone_client.py's
          # module docstring. Falls back to the single-factory
          # VOICE_SERVICE_REPO/VOICE_SERVICE_DISPATCH_PAT pair below if
          # this is unset.
          VOICE_FACTORIES_JSON: ${{ secrets.VOICE_FACTORIES_JSON }}
          VOICE_SERVICE_REPO: ${{ vars.VOICE_SERVICE_REPO }}
          VOICE_SERVICE_DISPATCH_PAT: ${{ secrets.VOICE_SERVICE_DISPATCH_PAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m scripts.voice_worker --channel "$CHANNEL"

      - name: Upload voiced pipeline data
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-voiced-${{ inputs.channel }}-${{ github.run_id }}
          path: core/${{ inputs.folder_path }}
          retention-days: 1
