name: Voice Generate (reusable)

# Called from video-pipeline.yml's "voice" job, NOT triggered directly.
# Deliberately its own workflow file (not just another job in
# video-pipeline.yml) with NO shared concurrency group -- this is the
# step that can sit for a long time polling the F5TTS Factory Pool (see
# voice_clone_client.py), and it must NOT hold video-pipeline.yml's
# shared "video-pipeline" lock while it waits, or every other queued
# channel sits idle behind it for no reason. Only the SAME channel can't
# overlap with itself (see the per-channel concurrency group below);
# different channels' voice jobs now run freely in parallel.
on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
      prepared_artifact:
        required: true
        type: string
      folder_path:
        required: true
        type: string
    outputs:
      voiced_artifact:
        value: ${{ jobs.generate.outputs.voiced_artifact }}
      # Pass-through of the folder path we were given. Callers should read
      # THIS instead of needs.prepare.outputs.folder_path directly -- a job
      # that needs both a plain job (prepare) AND a reusable-workflow-call
      # job (this one) in the same `needs:` list can get null back for the
      # plain job's outputs (observed in practice: needs.prepare.outputs.*
      # resolved to null in the publish job while needs.voice.outputs.*
      # resolved fine in that same job). Re-exposing it here sidesteps that
      # entirely since it's read from a reusable-workflow output, which is
      # the kind of reference that's reliable.
      folder_path:
        value: ${{ jobs.generate.outputs.folder_path }}

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    # Sep 2026, Dynamic Parallel Factory Allocation: this job may now poll
    # not just for its OWN F5TTS pieces to finish, but for a busy factory
    # to free up when every factory in the pool is currently owned by
    # OTHER channels -- deliberately with no timeout on that wait (see
    # voice_clone_client.py's module docstring). Bumped from 60 so a
    # channel isn't killed mid-wait by GitHub's own job ceiling; raise
    # further (max 360 on GitHub-hosted runners) if this pool regularly
    # has more concurrent channels than factories.
    timeout-minutes: 180
    concurrency:
      group: voice-generate-${{ inputs.channel }}
      cancel-in-progress: false
    outputs:
      voiced_artifact: pipeline-voiced-${{ inputs.channel }}-${{ github.run_id }}
      folder_path: ${{ inputs.folder_path }}
    steps:
      - name: Checkout private core repo
        uses: actions/checkout@v4
        with:
          repository: aman017181412-dev/yt-core
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: core
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: core/requirements.txt

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        working-directory: core
        run: pip install -r requirements.txt

      - name: Download prepared pipeline data
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.prepared_artifact }}
          path: core/${{ inputs.folder_path }}

      - name: Wait for voice generation (Factory Pool poll + merge, or edge-tts fallback)
        working-directory: core
        env:
          CHANNEL: ${{ inputs.channel }}
          # Multi-account Factory Pool -- see voice_clone_client.py's
          # module docstring. Falls back to the single-factory
          # VOICE_SERVICE_REPO/VOICE_SERVICE_DISPATCH_PAT pair below if
          # this is unset.
          VOICE_FACTORIES_JSON: ${{ secrets.VOICE_FACTORIES_JSON }}
          VOICE_SERVICE_REPO: ${{ vars.VOICE_SERVICE_REPO }}
          VOICE_SERVICE_DISPATCH_PAT: ${{ secrets.VOICE_SERVICE_DISPATCH_PAT }}
          # Sep 2026, Dynamic Parallel Factory Allocation: lib/factory_ledger.py
          # reads/writes data/voice_factory_state.json in THIS repo directly
          # over the Contents API (not the local checkout above -- see that
          # module's docstring for why), so it needs the repo name + a
          # write-capable token here too. No new secret: PRIVATE_REPO_PAT is
          # the same one the checkout step above already uses, and reaches
          # this job already via video-pipeline.yml's `secrets: inherit` --
          # it just wasn't exposed as an env var to THIS step before now.
          PRIVATE_REPO: aman017181412-dev/yt-core
          PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m scripts.voice_worker --channel "$CHANNEL"

      - name: Upload voiced pipeline data
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-voiced-${{ inputs.channel }}-${{ github.run_id }}
          path: core/${{ inputs.folder_path }}
          retention-days: 1
