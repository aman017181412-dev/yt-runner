name: Auto Unzip Root Files

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip all root-level zip files
        run: |
          shopt -s nullglob
          zip_files=(*.zip)

          if [ ${#zip_files[@]} -eq 0 ]; then
            echo "No zip file found at root, skipping."
            exit 0
          fi

          for zip_file in "${zip_files[@]}"; do
            echo "Unzipping: $zip_file"
            tmp_dir=$(mktemp -d)
            unzip -o "$zip_file" -d "$tmp_dir"

            # cp -a merges into existing folders (e.g. .github/) instead of
            # failing like `mv` does when the destination already exists.
            cp -a "$tmp_dir"/. .

            rm -rf "$tmp_dir"
            rm -f "$zip_file"
          done

      - name: Commit and push extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-unzip root zip file(s) [skip ci]"
            git push
          fi
