name: Auto Unzip

on: [push]

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    if: ${{!contains(github.event.head_commit.message, 'Auto extracted') }}
    steps:
      - uses: actions/checkout@v4

      - name: Unzip to root without workflows
        run: |
          shopt -s nullglob
          for file in *.zip; do
            echo "Unzipping $file"
            #.github ফোল্ডার বাদ দিয়ে রুটে unzip করবে
            unzip -o "$file" -d. -x ".github/*"
            rm "$file"
          done

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto extracted zip files" || exit 0
          git push
