name: Auto Unzip

on: [push]

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    if: ${{!contains(github.event.head_commit.message, 'Auto extracted') }}
    steps:
      - uses: actions/checkout@v4

      - name: Unzip to root
        run: |
          pwd
          ls -lh
          shopt -s nullglob
          for file in *.zip; do
            echo "Found zip: $file"
            unzip -l "$file"
            echo "Extracting to root..."
            unzip -o "$file" -d.
          done
          echo "--- After extract ---"
          ls -lh

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "Auto extracted zip files" || exit 0
          git push
